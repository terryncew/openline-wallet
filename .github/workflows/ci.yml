name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: PLATFORM-EXIT-001
        run: |
          python -m openline_wallet demo-platform-exit --output platform-exit-artifacts
          python -m openline_wallet verify platform-exit-artifacts/wallet-after.olw
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
