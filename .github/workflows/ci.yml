name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[mcp]"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Verify frozen predecessor evidence
        run: python proofs/provider-effect-001/verify_prior.py --output historical-artifacts/reappraisal.json
      - name: Upload historical diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-evidence-${{ matrix.python-version }}
          path: historical-artifacts/
          if-no-files-found: warn
      - name: PROVIDER-EFFECT-001
        run: |
          python proofs/provider-effect-001/reproduce.py --output provider-effect-artifacts
          python proofs/provider-effect-001/verify.py provider-effect-artifacts
      - name: Upload provider-effect diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-effect-${{ matrix.python-version }}
          path: provider-effect-artifacts/
          if-no-files-found: warn
      - name: PLATFORM-EXIT-001
        run: |
          python -m openline_wallet demo-platform-exit --output platform-exit-artifacts
          python -m openline_wallet verify platform-exit-artifacts/wallet-after.olw
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
