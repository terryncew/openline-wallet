name: APPROVED-JOB-LIVE-001

on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "proofs/approved-job-live-001/**"
      - "APPROVED_JOB_LIVE_001.md"
      - "proofs/approved-job-001/**"
      - "proofs/egress-gate-001/**"
      - "EGRESS_GATE_001.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/approved-job-live-001.yml"
  pull_request:
    paths:
      - "proofs/approved-job-live-001/**"
      - "APPROVED_JOB_LIVE_001.md"
      - "proofs/approved-job-001/**"
      - "proofs/egress-gate-001/**"
      - "EGRESS_GATE_001.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/approved-job-live-001.yml"
  workflow_dispatch:
    inputs:
      run_real_hosts:
        description: "Run Claude -> Codex live provider replacement"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  controlled-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-airlock
          ref: fb02207f3ac561368beeabf9ff168076bf828824
          path: .deps/airlock
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install exact evaluator checkout and Wallet
        run: python -m pip install -e . -e .deps/airlock

      - name: Reproduce predecessor approved-job proof
        run: |
          python proofs/approved-job-001/run.py --output approved-job-predecessor-artifacts
          python proofs/approved-job-001/run.py --verify approved-job-predecessor-artifacts

      - name: Verify current Receiver Gate boundary
        run: |
          python proofs/egress-gate-001/run.py --output egress-gate-preflight-artifacts
          python proofs/egress-gate-001/run.py --verify egress-gate-preflight-artifacts

      - name: Run provider-replacement continuation proof
        run: python proofs/approved-job-live-001/run.py --output approved-job-live-artifacts --mode scripted

      - name: Verify continuation evidence
        run: python proofs/approved-job-live-001/run.py --verify approved-job-live-artifacts

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-job-live-001-${{ matrix.python-version }}
          path: approved-job-live-artifacts/
          if-no-files-found: warn

  real-hosts:
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_hosts == true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-airlock
          ref: fb02207f3ac561368beeabf9ff168076bf828824
          path: .deps/airlock
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is required."
            exit 2
          fi
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
            exit 2
          fi

      - name: Install Wallet, exact Airlock, and pinned provider hosts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e . -e .deps/airlock
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          test "$(command -v bwrap)" = "/usr/bin/bwrap"
          bwrap --version
          npm install -g @anthropic-ai/claude-code@2.1.260 @openai/codex@0.153.0
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/codex-home"
          claude --version
          codex --version

      - name: Check both Codex sandbox paths before provider calls
        run: python proofs/approved-job-live-001/run.py --sandbox-preflight approved-job-sandbox-artifacts

      - name: Authenticate Codex
        shell: bash
        run: |
          set -euo pipefail
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status

      - name: Verify current Receiver Gate boundary
        shell: bash
        run: |
          set -euo pipefail
          python proofs/egress-gate-001/run.py --output egress-gate-real-preflight-artifacts
          python proofs/egress-gate-001/run.py --verify egress-gate-real-preflight-artifacts

      - name: Verify checkout credentials are absent
        shell: bash
        run: |
          set -euo pipefail
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "::error::checkout credential persisted into the real-host workspace"
            exit 4
          fi

      - name: Run real provider handoff
        shell: bash
        run: |
          set -euo pipefail
          python proofs/approved-job-live-001/run.py \
            --output approved-job-live-real-artifacts \
            --mode real

      - name: Require real-host verdict
        shell: bash
        run: |
          set -euo pipefail
          python proofs/approved-job-live-001/run.py \
            --verify approved-job-live-real-artifacts \
            --require-real

      - name: Reject accidental private-key evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=approved-job-live-real-artifacts
          if [[ -d "$OUT" ]] && find "$OUT" -type f \( -name '*.key' -o -name 'root.key' -o -name 'epoch.key' \) | grep -q .; then
            echo "::error::private key entered public evidence directory"
            exit 3
          fi

      - name: Preserve real-host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-job-live-001-real-hosts
          path: |
            approved-job-live-real-artifacts/
            approved-job-sandbox-artifacts/
          if-no-files-found: warn
          retention-days: 30
