name: RRSI promotion adapter

on:
  pull_request:
  push:
    branches: ["preview/**"]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[mcp]"
      - name: Clone pinned RRSI source (read-only outside apparatus)
        env:
          RRSI_REPO: ${{ runner.temp }}/rrsi
        run: |
          git clone --quiet https://github.com/google-research/rrsi "$RRSI_REPO"
          git -C "$RRSI_REPO" checkout --quiet e4d1a7a0388e02b388bc40eb0a125fcfc7123f8d
      - name: Adapter tests
        env:
          RRSI_REPO: ${{ runner.temp }}/rrsi
        run: python -m unittest tests.test_rrsi_promotion_adapter -v
      - name: Quickstart smoke
        env:
          RRSI_REPO: ${{ runner.temp }}/rrsi
        run: bash demo/rrsi-promotion-adapter/quickstart.sh "$RUNNER_TEMP/adapter-work"
