name: STOP-BARRIER-COLD-001

on:
  push:
    branches:
      - main
      - "proof/**"
  pull_request:

jobs:
  stop-barrier:
    name: stop-barrier (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e .

      - name: Reproduce STOP-BARRIER-COLD-001
        run: |
          rm -rf stop-barrier-cold-artifacts
          python proofs/stop-barrier-cold-001/run.py --output stop-barrier-cold-artifacts

      - name: Verify STOP-BARRIER-COLD-001
        run: python proofs/stop-barrier-cold-001/run.py --verify stop-barrier-cold-artifacts

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-barrier-cold-001-${{ matrix.python-version }}
          path: stop-barrier-cold-artifacts/
          if-no-files-found: warn
