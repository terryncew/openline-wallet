name: PLATFORM-EXIT-LIVE-001 — real hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claude-to-codex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set runner-local paths
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKSPACE=$RUNNER_TEMP/platform-exit-live" >> "$GITHUB_ENV"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY repository secret is required."
            exit 2
          fi
          if [[ -z "${ANTHROPIC_API_KEY:-}" && -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]]; then
            echo "::error::Set ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
            exit 2
          fi

      - name: Install OpenLine Wallet and pinned provider hosts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ".[mcp]"
          npm install -g @anthropic-ai/claude-code@2.1.260 @openai/codex@0.153.0
          mkdir -p "$CODEX_HOME"
          {
            echo "claude=$(claude --version 2>&1 | head -1)"
            echo "codex=$(codex --version 2>&1 | head -1)"
            python - <<'PY'
          import importlib.metadata
          print("mcp=" + importlib.metadata.version("mcp"))
          print("openline-wallet=" + importlib.metadata.version("openline-wallet"))
          PY
          } | tee "${RUNNER_TEMP}/host-versions.txt"

      - name: Prepare user-owned authority and receiver
        shell: bash
        run: |
          set -euo pipefail
          openline-wallet-platform-exit prepare "$WORKSPACE"
          bash -lc "$(cat "$WORKSPACE/start-gate.txt")" \
            >"${RUNNER_TEMP}/receiver-gate.log" 2>&1 &
          echo "$!" > "${RUNNER_TEMP}/receiver-gate.pid"
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(50):
              try:
                  with urlopen("http://127.0.0.1:8765/health", timeout=1) as r:
                      if r.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(0.1)
          raise SystemExit("receiver Gate did not become healthy")
          PY

      - name: Claude before switch — must call Wallet MCP tool
        shell: bash
        run: |
          set -euo pipefail
          claude -p \
            --mcp-config "$WORKSPACE/claude-mcp.json" \
            --allowedTools "mcp__openline_wallet__deploy_staging" \
            --max-turns 3 \
            --output-format json \
            "Call the openline_wallet deploy_staging tool exactly once with release claude-before. Do not use any other tool. Report the tool result." \
            | tee "${RUNNER_TEMP}/claude-before.json"

          # This fails closed unless the real Claude host earned an ALLOWED receiver receipt.
          openline-wallet-platform-exit switch "$WORKSPACE"

      - name: Claude after switch — old authority must stop
        shell: bash
        run: |
          set -euo pipefail
          claude -p \
            --mcp-config "$WORKSPACE/claude-mcp.json" \
            --allowedTools "mcp__openline_wallet__deploy_staging" \
            --max-turns 3 \
            --output-format json \
            "Call the openline_wallet deploy_staging tool exactly once with release claude-after. Do not use any other tool. Report the tool result, even if the receiver refuses it." \
            | tee "${RUNNER_TEMP}/claude-after.json"

      - name: Configure Codex with the same receiver path
        shell: bash
        run: |
          set -euo pipefail
          cp "$WORKSPACE/codex-mcp.toml" "$CODEX_HOME/config.toml"
          cat "$CODEX_HOME/config.toml"

      - name: Authenticate Codex with OpenAI API key
        shell: bash
        run: |
          set -euo pipefail
          printenv OPENAI_API_KEY | codex login --with-api-key
          codex login status

      - name: Preflight Codex authority path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from urllib.request import urlopen

          from openline_wallet.canonical import strict_json_load
          from openline_wallet.wallet import verify_bundle

          codex_home = Path(os.environ["CODEX_HOME"])
          workspace = Path(os.environ["WORKSPACE"])
          config = tomllib.loads((codex_home / "config.toml").read_text())
          server = config["mcp_servers"]["openline_wallet"]

          if server.get("enabled_tools") != ["deploy_staging"]:
              raise SystemExit("Codex MCP allow-list is not exactly deploy_staging")
          approval = server.get("tools", {}).get("deploy_staging", {}).get("approval_mode")
          if approval != "approve":
              raise SystemExit(f"Codex deploy_staging approval mode is {approval!r}, expected 'approve'")

          args = server.get("args", [])
          def arg_value(flag):
              try:
                  return args[args.index(flag) + 1]
              except (ValueError, IndexError):
                  raise SystemExit(f"Codex MCP config missing {flag}")

          bundle_path = Path(arg_value("--bundle"))
          key_path = Path(arg_value("--subject-key"))
          if bundle_path != workspace / "current.olw" or not bundle_path.is_file():
              raise SystemExit("Codex MCP bundle path is missing or unexpected")
          if key_path != workspace / "subjects" / "codex.key" or not key_path.is_file():
              raise SystemExit("Codex subject key path is missing or unexpected")

          bundle = strict_json_load(bundle_path)
          _verified, timeline = verify_bundle(bundle)
          claude = timeline.mandates.get("mandate-claude", {})
          codex = timeline.mandates.get("mandate-codex", {})
          if claude.get("status") != "REVOKED":
              raise SystemExit("Claude mandate is not revoked before Codex handoff")
          if codex.get("status") != "ACTIVE":
              raise SystemExit("Codex mandate is not active before Codex handoff")
          if codex.get("subject_id") != "provider-codex":
              raise SystemExit("Codex mandate subject binding is wrong")
          if codex.get("scopes") != ["deploy:staging"]:
              raise SystemExit("Codex mandate scope is not exactly deploy:staging")

          with urlopen("http://127.0.0.1:8765/health", timeout=2) as response:
              if response.status != 200:
                  raise SystemExit("Receiver Gate is not healthy before Codex handoff")

          print("Codex preflight: PASS")
          PY
          codex mcp list

      - name: Codex after switch — current authority must continue
        shell: bash
        run: |
          set -euo pipefail
          codex exec \
            --ephemeral \
            --skip-git-repo-check \
            --sandbox read-only \
            "Call the openline_wallet MCP tool deploy_staging exactly once with release codex-after. Do not use shell commands or edit files. Report the tool result." \
            2>&1 | tee "${RUNNER_TEMP}/codex-after.log"

      - name: Require Codex receiver consequence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ["WORKSPACE"])
          receipts_dir = workspace / "receiver" / "receipts"
          receipts = []
          for path in receipts_dir.glob("*.json"):
              receipts.append(json.loads(path.read_text()))
          effects_path = workspace / "receiver" / "effects.json"
          effects = json.loads(effects_path.read_text()) if effects_path.exists() else []

          allowed = [
              r for r in receipts
              if r.get("subject_id") == "provider-codex"
              and r.get("decision") == "ALLOWED"
              and r.get("action") == "deploy:staging"
          ]
          applied = [
              e for e in effects
              if e.get("subject_id") == "provider-codex"
              and e.get("release") == "codex-after"
          ]
          if not allowed:
              log = Path(os.environ["RUNNER_TEMP"], "codex-after.log")
              tail = "\n".join(log.read_text(errors="replace").splitlines()[-30:]) if log.exists() else "<no Codex log>"
              raise SystemExit("Codex exited without an ALLOWED receiver receipt.\n" + tail)
          if len(applied) != 1:
              raise SystemExit(f"expected exactly one codex-after effect, found {len(applied)}")
          print("Codex receiver consequence: PASS")
          PY

      - name: Verify provider replacement
        shell: bash
        run: |
          set -euo pipefail
          openline-wallet-platform-exit verify "$WORKSPACE" --json \
            | tee "${RUNNER_TEMP}/platform-exit-result.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "platform-exit-result.json").read_text())
          expected = "PLATFORM_EXIT_LIVE_CONTINUITY_ENFORCED"
          if result.get("verdict") != expected:
              raise SystemExit(f"expected {expected}, got {result.get('verdict')}")
          checks = result.get("checks", {})
          failed = [name for name, value in checks.items() if value is not True]
          if failed:
              raise SystemExit("failed checks: " + ", ".join(failed))
          print(expected)
          PY

      - name: Freeze non-secret evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/platform-exit-public-evidence"
          mkdir -p "$OUT/receiver/receipts"

          for f in \
            "${RUNNER_TEMP}/host-versions.txt" \
            "${RUNNER_TEMP}/claude-before.json" \
            "${RUNNER_TEMP}/claude-after.json" \
            "${RUNNER_TEMP}/codex-after.log" \
            "${RUNNER_TEMP}/receiver-gate.log" \
            "${RUNNER_TEMP}/platform-exit-result.json"
          do
            if [[ -f "$f" ]]; then cp "$f" "$OUT/"; fi
          done

          if [[ -f "$WORKSPACE/current.olw" ]]; then
            cp "$WORKSPACE/current.olw" "$OUT/current.olw"
          fi
          if [[ -f "$WORKSPACE/receiver/effects.json" ]]; then
            cp "$WORKSPACE/receiver/effects.json" "$OUT/receiver/effects.json"
          fi
          if [[ -d "$WORKSPACE/receiver/receipts" ]]; then
            cp "$WORKSPACE/receiver/receipts/"*.json "$OUT/receiver/receipts/" 2>/dev/null || true
          fi

          # Never upload Wallet or subject private keys.
          if find "$OUT" -type f \( -name '*.key' -o -name 'root.key' -o -name 'epoch.key' \) | grep -q .; then
            echo "::error::private key entered public evidence directory"
            exit 3
          fi

          (cd "$OUT" && sha256sum $(find . -type f -print | sort) > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-exit-live-001-real-hosts
          path: ${{ runner.temp }}/platform-exit-public-evidence
          if-no-files-found: error
          retention-days: 30
