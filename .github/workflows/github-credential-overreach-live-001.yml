name: GITHUB-CREDENTIAL-OVERREACH-LIVE-001

on:
  push:
    branches: [main, "proof/**"]
    paths:
      - ".github/workflows/github-credential-overreach-live-001.yml"
      - "GITHUB_CREDENTIAL_OVERREACH_LIVE_001.md"
      - "PREREGISTRATION_GITHUB_CREDENTIAL_OVERREACH_LIVE_001.json"
      - "scripts/github_credential_overreach_live.py"
      - "tests/test_github_credential_overreach_live.py"
  pull_request:
    paths:
      - ".github/workflows/github-credential-overreach-live-001.yml"
      - "GITHUB_CREDENTIAL_OVERREACH_LIVE_001.md"
      - "PREREGISTRATION_GITHUB_CREDENTIAL_OVERREACH_LIVE_001.json"
      - "scripts/github_credential_overreach_live.py"
      - "tests/test_github_credential_overreach_live.py"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN GITHUB CREDENTIAL OVERREACH to authorize one disposable GitHub merge"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-credential-overreach-live-001
  cancel-in-progress: false

jobs:
  controlled-proof:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: ebe6b2882095aba64611f5802ad5fdcf8e65961a
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Wallet
        run: python -m pip install "./wallet[mcp]"
      - name: Verify exact Wallet pin
        run: test "$(git -C wallet rev-parse HEAD)" = "ebe6b2882095aba64611f5802ad5fdcf8e65961a"
      - name: Existing provider sandbox tests
        run: python -m unittest discover -s tests -v
      - name: Compile launcher
        run: python -m compileall -q scripts tests

  live-provider:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN GITHUB CREDENTIAL OVERREACH'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: ebe6b2882095aba64611f5802ad5fdcf8e65961a
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Wallet
        run: python -m pip install "./wallet[mcp]"
      - name: Verify exact Wallet pin
        run: test "$(git -C wallet rev-parse HEAD)" = "ebe6b2882095aba64611f5802ad5fdcf8e65961a"
      - name: Test Wallet before provider authority
        run: python -m unittest discover -s wallet/tests -v
      - name: Test provider harness before provider authority
        run: python -m unittest discover -s tests -v
      - name: Compile launcher before provider authority
        run: python -m compileall -q scripts tests
      - name: Run real GitHub credential-overreach experiment
        env:
          OPENLINE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPERIMENT_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/github_credential_overreach_live.py \
            --run-id "$EXPERIMENT_RUN_ID" \
            --state "$RUNNER_TEMP/github-credential-overreach-private" \
            --output "$RUNNER_TEMP/github-credential-overreach-public" \
            --confirm 'RUN GITHUB CREDENTIAL OVERREACH'
      - name: Independently verify public evidence
        run: |
          python scripts/github_credential_overreach_live.py \
            --verify "$RUNNER_TEMP/github-credential-overreach-public" \
            --require-live
      - name: Reject accidental private-key evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/github-credential-overreach-public"
          if [[ -d "$OUT" ]] && find "$OUT" -type f -name '*.key' | grep -q .; then
            echo "::error::private key entered public evidence"
            exit 3
          fi
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-credential-overreach-live-001-${{ github.run_id }}
          path: ${{ runner.temp }}/github-credential-overreach-public/
          if-no-files-found: warn
          retention-days: 90
