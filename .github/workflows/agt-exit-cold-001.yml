name: AGT-EXIT-COLD-001

on:
  push:
    branches: [main, "proof/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  comparator:
    name: comparator (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Wallet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Microsoft AGT
        uses: actions/checkout@v4
        with:
          repository: microsoft/agent-governance-toolkit
          ref: 0533ceaf6c5b0975bfc71bff42f6ccd2d34c8adf
          path: _external/agt
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Wallet and selected AGT comparator dependencies
        run: |
          python -m pip install -e .
          python -m pip install -e "_external/agt/agent-governance-python/agentmesh-integrations/mcp-receipt-governed[crypto,dev]"
          python -m pip install "pydantic>=2.13.4,<3.0" "httpx>=0.28.1,<1.0" "pytest>=8,<10" "pytest-asyncio>=0.23,<2.0"

      - name: Classifier falsifier self-test
        run: python proofs/agt-exit-cold-001/run.py --self-test

      - name: Run pinned comparator
        run: |
          rm -rf "${{ runner.temp }}/agt-exit-cold-artifacts"
          python proofs/agt-exit-cold-001/run.py --agt-root _external/agt --output "${{ runner.temp }}/agt-exit-cold-artifacts"

      - name: Independently verify comparator
        run: python proofs/agt-exit-cold-001/verify.py "${{ runner.temp }}/agt-exit-cold-artifacts"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agt-exit-cold-001-${{ matrix.python-version }}
          path: ${{ runner.temp }}/agt-exit-cold-artifacts/
          if-no-files-found: warn
