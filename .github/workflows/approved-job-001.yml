name: APPROVED-JOB-001
on:
  push:
    branches: [main, "feat/**", "fix/**"]
    paths:
      - "proofs/approved-job-001/**"
      - "APPROVED_JOB_001.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/approved-job-001.yml"
  pull_request:
    paths:
      - "proofs/approved-job-001/**"
      - "APPROVED_JOB_001.md"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/approved-job-001.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-airlock
          ref: fb02207f3ac561368beeabf9ff168076bf828824
          path: .deps/airlock
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact evaluator checkout and Wallet
        run: python -m pip install -e . -e .deps/airlock
      - name: Verify frozen predecessor settlement proof
        run: python proofs/coordinator-001/verify.py proofs/coordinator-001/frozen
      - name: Reproduce approved job replacement proof
        run: python proofs/approved-job-001/run.py --output approved-job-artifacts
      - name: Verify reproduced evidence
        run: python proofs/approved-job-001/run.py --verify approved-job-artifacts
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-job-001-${{ matrix.python-version }}
          path: approved-job-artifacts/
          if-no-files-found: warn
