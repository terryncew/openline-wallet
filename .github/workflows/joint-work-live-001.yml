name: JOINT-WORK-LIVE-001

on:
  push:
    branches:
      - main
      - "proof/**"
      - "research/**"
  pull_request:

permissions:
  contents: read

jobs:
  scripted:
    name: scripted (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Wallet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Airlock
        uses: actions/checkout@v4
        with:
          repository: terryncew/openline-airlock
          ref: 3ef34fb0100516e458cb362a7448c78a72da097b
          path: _airlock
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen sources
        run: |
          python -m pip install -e .
          python -m pip install -e ./_airlock

      - name: Harness self-test
        run: python proofs/joint-work-live-001/run.py --self-test

      - name: Run zero-spend scripted arm
        run: |
          rm -rf "${{ runner.temp }}/joint-work-scripted"
          python proofs/joint-work-live-001/run.py \
            --mode scripted \
            --output "${{ runner.temp }}/joint-work-scripted"

      - name: Verify scripted arm
        run: |
          python proofs/joint-work-live-001/verify.py \
            "${{ runner.temp }}/joint-work-scripted"

      - name: Upload scripted receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-work-live-001-scripted-${{ matrix.python-version }}
          path: ${{ runner.temp }}/joint-work-scripted/
          if-no-files-found: warn

  activation:
    name: live activation gate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: gate
        name: Allow one live run from activation or the frozen branch-recreation retry
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          enabled=false
          : > /tmp/joint-changed.txt

          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" == "refs/heads/proof/joint-work-live-001" ]]; then
            if [[ -n "${BEFORE:-}" && "$BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only "$BEFORE" "$GITHUB_SHA" > /tmp/joint-changed.txt
            else
              # GitHub reports an all-zero `before` when a deleted proof branch is
              # recreated. The first activation push hit that case after PR #29 was
              # accidentally merged, so the live job was correctly skipped.
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > /tmp/joint-changed.txt
            fi

            cat /tmp/joint-changed.txt

            activation_changed=false
            if grep -Fxq "proofs/joint-work-live-001/LIVE_ARM.json" /tmp/joint-changed.txt; then
              activation_changed=true
            fi
            if grep -Fxq "proofs/joint-work-live-001/LIVE_ARM_RETRY_001.json" /tmp/joint-changed.txt; then
              activation_changed=true
            fi
            if grep -Fxq "proofs/joint-work-live-001/LIVE_PROVIDER_RETRY_002.json" /tmp/joint-changed.txt; then
              activation_changed=true
            fi

            if [[ "$activation_changed" == "true" ]]; then
              test -f proofs/joint-work-live-001/LIVE_ARM.json
              enabled=true
            fi
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  live:
    name: bounded real-host arm
    needs: [scripted, activation]
    if: needs.activation.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout Wallet without repository credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned Airlock
        uses: actions/checkout@v4
        with:
          repository: terryncew/openline-airlock
          ref: 3ef34fb0100516e458cb362a7448c78a72da097b
          path: _airlock
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frozen OpenLine sources
        run: |
          python -m pip install -e .
          python -m pip install -e ./_airlock

      - name: Install sandbox prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Install bounded provider CLIs
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.260
          npm install -g @openai/codex@0.153.0
          claude --version
          codex --version

      - name: Verify repository credentials are absent
        run: |
          test -z "$(git config --local --get-all http.https://github.com/.extraheader || true)"
          test -z "${GITHUB_TOKEN:-}"
          test -z "${GH_TOKEN:-}"

      - name: Run bounded real-host arm
        run: |
          rm -rf "${{ runner.temp }}/joint-work-live"
          python proofs/joint-work-live-001/run.py \
            --mode real \
            --output "${{ runner.temp }}/joint-work-live"

      - name: Verify live receipt
        run: |
          python proofs/joint-work-live-001/verify.py \
            --require-live \
            "${{ runner.temp }}/joint-work-live"

      - name: Upload live receipt and redacted provider logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joint-work-live-001-live
          path: ${{ runner.temp }}/joint-work-live/
          if-no-files-found: warn
